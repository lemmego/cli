on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          project_path: "./cmd"
          binary_name: "lemmego"
          compress_assets: 'OFF'
          # Stamp the tag into the binary. Without this the version has to be
          # hardcoded in the source, which is how `lemmego --version` came to
          # report 0.1.59 for every release from v0.1.60 to v0.1.66: a literal
          # is always valid, so nothing ever failed to remind anyone.
          # github.ref_name is the tag that triggered the release.
          ldflags: -s -w -X github.com/lemmego/cli.version=${{ github.ref_name }}
