root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # -ldflags='-w -s' drops DWARF and the symbol table. That is worth doing on
  # a reload loop and not only on a deployment, because a megabyte is paid for
  # twice: once linking it and once faulting the new binary in on its first
  # execution. Measured on a real application at roughly 50ms per megabyte,
  # linearly — a 52MB binary took 2.6s to reach its port where the *same*
  # binary re-run took 0.08s, so almost all of a reload's startup is loading
  # the file rather than anything the application does. Stripping took 13.8MB
  # off that one.
  #
  # -gcflags='-N -l' used to be here and is gone deliberately. Go applies
  # -gcflags only to the packages named on the command line, so it disabled
  # optimisation for ./cmd/app alone while every other package stayed
  # optimised — no debuggability worth having, and the binary measured the same
  # size with and without it. Build without -ldflags when you want to attach a
  # debugger, and use -gcflags=all='-N -l' if you mean it.
  cmd = "CGO_ENABLED=0 go build -ldflags='-w -s' -o ./tmp/main ./cmd/app"
  # resources/js, resources/css and bootstrap/ssr hold nothing matching
  # include_ext, so air could only ever watch them to discard the events.
  # Vite owns the first two with HMR, and the third is its build output —
  # watching your own artefacts is one include_ext edit away from a loop.
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "testdata", "storage",
                 "public", "static", "resources/js", "resources/css", "bootstrap/ssr"]
  exclude_file = []
  exclude_regex = ["_test.go", ".*_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  # "env" is for .env, so editing a variable restarts the server. Without it
  # air watches the file and ignores the event: the rebuild decision filters
  # on include_ext, and .env has no extension to match — which makes a changed
  # variable look like it did nothing, because the running process still holds
  # the old environment. include_file = [".env"] does not help; it adds the
  # watch that already existed and not the trigger.
  include_ext = ["go", "tpl", "tmpl", "gohtml", "templ", "html", "env"]
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
